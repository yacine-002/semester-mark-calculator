<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S2 Average Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    input {
      width: 80px;
      padding: 4px;
    }

    .result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>S2 Average Calculator</h2>

  <table>
    <thead>
      <tr>
        <th>Module</th>
        <th>Coef</th>
        <th>Inputs</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="result" id="result">S2 Average: 0 / 20</div>
</div>

<script>
const modules = [
  { key: "analysis", label: "Analysis", coef: 5, type: "mcc_exam" },
  { key: "chemistry", label: "Chemistry", coef: 5, type: "mtp_mcc_exam" },
  { key: "physics", label: "Physics", coef: 5, type: "mtp_mcc_exam" },
  { key: "algebra", label: "Algebra", coef: 4, type: "mcc_exam" },
  { key: "algo", label: "Algorithms", coef: 3, type: "mcc_exam" },
  { key: "probability", label: "Probability", coef: 3, type: "mcc_exam" },
  { key: "cao", label: "CAO", coef: 1, type: "mtp_exam" },
  { key: "human", label: "Human Engineering", coef: 1, type: "mcc_exam" },
  { key: "english", label: "English", coef: 1, type: "mcc_exam" },
  { key: "french", label: "French", coef: 1, type: "mcc_exam" },
  { key: "economy", label: "Economy", coef: 1, type: "mcc_exam" }
];

const state = {};

function avgMccExam(mcc, exam) {
  return 0.4 * mcc + 0.6 * exam;
}

function avgMtpMccExam(mtp, mcc, exam) {
  return 0.3 * mtp + 0.3 * mcc + 0.4 * exam;
}

function avgMtpExam(mtp, exam) {
  return 0.4 * mtp + 0.6 * exam;
}

function render() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  modules.forEach(m => {
    let inputs = "";

    if (m.type === "mtp_mcc_exam") {
      inputs = `
        <input type='number' step='0.5' placeholder='MTP' onchange="update('${m.key}','mtp',this.value)">
        <input type='number' step='0.5' placeholder='MCC' onchange="update('${m.key}','mcc',this.value)">
        <input type='number' step='0.5' placeholder='Exam' onchange="update('${m.key}','exam',this.value)">
      `;
    } else if (m.type === "mcc_exam") {
      inputs = `
        <input type='number' step='0.5' placeholder='MCC' onchange="update('${m.key}','mcc',this.value)">
        <input type='number' step='0.5' placeholder='Exam' onchange="update('${m.key}','exam',this.value)">
      `;
    } else if (m.type === "mtp_exam") {
      inputs = `
        <input type='number' step='0.5' placeholder='MTP' onchange="update('${m.key}','mtp',this.value)">
        <input type='number' step='0.5' placeholder='Exam' onchange="update('${m.key}','exam',this.value)">
      `;
    }

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${m.label}</td>
      <td>${m.coef}</td>
      <td>${inputs}</td>
    `;

    tbody.appendChild(row);
  });
}

function update(key, field, value) {
  if (!state[key]) state[key] = {};
  state[key][field] = parseFloat(value) || 0;
  compute();
}

function compute() {
  let total = 0;

  modules.forEach(m => {
    const v = state[m.key] || {};
    let avg = 0;

    if (m.type === "mcc_exam") {
      avg = avgMccExam(v.mcc || 0, v.exam || 0);
    } else if (m.type === "mtp_mcc_exam") {
      avg = avgMtpMccExam(v.mtp || 0, v.mcc || 0, v.exam || 0);
    } else if (m.type === "mtp_exam") {
      avg = avgMtpExam(v.mtp || 0, v.exam || 0);
    }

    total += avg * m.coef;
  });

  const final = total / 30;
  document.getElementById("result").innerText = "S2 Average: " + (isNaN(final) ? 0 : final.toFixed(2)) + " / 20";
}

render();
</script>

</body>
</html>
